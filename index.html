<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <main class="main">
        <form class="fomulaire">

            <header class="heard">
                <div class="divcarhead">

                    <div>
                        <h1>Inscription étudiant</h1>
                        <p>Renseignez les informations de l'etudiant</p>
                    </div>
                </div>
            </header>

            <div class="carform">

                <div class="clnom">
                    <label>NOM</label>
                    <input type="text" id="nom" placeholder="NOM" required>
                </div>

                <div class="clprenom">
                    <label>PRENOM</label>
                    <input type="text" id="PRENOM" placeholder="PRENOM" required>
                </div>

                <div class="daten">
                    <label>DATE DE NAISSANCE</label>
                    <input type="date" id="date" placeholder="DATE DE NAISSANCE" required>
                   
                </div>

                <div class="clselect">
                    <label>FILIERE</label>
                    <select id="FILIERE">
                        <option>SELECTIONNER UNE FILIERE</option>
                        <option>Analyste programmation</option>
                        <option>Reseaux et telecommunication</option>
                        <option>Gestion</option>
                        <option>Comptabilité</option>
                    </select>

                    <hr>

                    <div class="butt">
                              <button type="reset" class="clannuler">Annuler</button>
                              <button type="submit" class="clannuler">Enregistrer</button>
                    </div>


                </div>

            </div>



        </form>

    </main>

</body>
</html>
