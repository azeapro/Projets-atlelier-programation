<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription étudiant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main">

        <form class="fomulaire">

            <header class="heard">
                <div>
                    <h1 class="hh1">Inscription étudiant</h1>
                    <p class="pp1">Renseignez les informations de l'étudiant</p>
                </div>
            </header>

            <div class="carform">

                <div class="h">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" placeholder="Traoré" required>
                </div>

                <div class="h">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" placeholder="Aminata" required>
                </div>

                <div class="h full">
                    <label for="date">Date de naissance</label>
                    <input type="date" id="date" required>
                </div>

                <div class="h full">
                    <label for="filiere">Filière</label>

                    <select id="filiere" required>
                        <option value="">Sélectionner une filière</option>
                        <option>Analyse et programmation</option>
                        <option>Réseaux et télécommunication</option>
                        <option>Gestion</option>
                        <option>Comptabilité</option>
                    </select>
                </div>

                <hr>

                <div class="butt">
                    <button type="reset" class="bu clannuler">
                        Annuler
                    </button>

                    <button type="submit" class="bu clenregistrer">
                        Enregistrer
                    </button>
                </div>

            </div>

        </form>

    </main>

</body>
</html>
